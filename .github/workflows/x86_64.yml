name: Build ToaruOS ISO

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Initializes the kuroko submodule

    - name: Pull Docker image
      run: docker pull toaruos/build-tools:1.99.x

    - name: Build ISO
      run: |
        docker run -v ${{ github.workspace }}:/root/misaka -w /root/misaka -e LANG=C.UTF-8 -t toaruos/build-tools:1.99.x util/build-in-docker.sh

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: toaruos-iso
        path: image.iso
        retention-days: 30  # Keep artifacts for 30 days; adjust as needed
